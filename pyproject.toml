[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pmvb"
version = "0.1.0"
description = "Poor Man's Validation Bench — orchestration layer (PyVISA, pytest, InfluxDB, Grafana, MCP gateway)"
requires-python = ">=3.11"
authors = [{name = "Bradley Ward"}]
license = {text = "MIT"}
readme = "README.md"

dependencies = [
    # SCPI / VISA stack
    "pyvisa>=1.13",
    "pyvisa-py>=0.7",
    "pyvisa-sim>=0.6",
    # USB-TMC backend dependencies
    "pyusb>=1.2",
    "pyserial>=3.5",
    # Test runner
    "pytest>=7.4",
    # Time-series database client (works against InfluxDB 2.x natively; also handles 1.x compat mode)
    "influxdb-client>=1.40",
    # Report generation
    "jinja2>=3.1",
    "matplotlib>=3.8",
    # MCP gateway: server framework + Anthropic Claude SDK
    "mcp>=1.0",
    "anthropic>=0.34",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.urls]
Homepage = "https://github.com/Pike1950/poor-mans-validation-bench"
Documentation = "https://pike1950.github.io/poor-mans-validation-bench/"

[tool.setuptools.packages.find]
include = ["pmvb*"]
exclude = ["tests*", "tools*", "docs*", "sim*", "modules*", "firmware*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "module: mark a test as exercising a specific module (e.g. @pytest.mark.module('1B'))",
    "hardware: mark a test as requiring real Pico hardware (deselected by default in CI)",
    "sim: mark a test as simulator-only (no hardware required)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = []
