# Pico-to-nickname registry.
#
# Maps the USB iSerialNumber (RP2350 unique chip ID, 16 hex chars) to a
# human-readable nickname so tools like hot_plug_verify.py can show friendly
# labels instead of hex chip IDs.
#
# Edit this file when you swap in new Picos or rename existing ones. The
# nickname can be any short string; convention is "Pico #N" during Phase 0
# probe firmware, "Module 1A", "Module 1B", etc. once the per-module firmware
# replaces the stub.

# Phase 0 stub firmware Picos, baseline arrangement (odd Sabrent slots 1-9).
